name: Restore AxeNStax deployment secret (one-off)

# Confirm read-only access to the existing host, then encrypt the deployment
# credential directly for the destination repository. Print only ciphertext.
on:
  workflow_dispatch:
permissions: {}
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned encryption library
        run: |
          python3 -m venv "$RUNNER_TEMP/secret-recovery"
          "$RUNNER_TEMP/secret-recovery/bin/pip" install --quiet --only-binary=:all: PyNaCl==1.6.2
      - name: Encrypt existing deployment key for the active repository
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DESTINATION_PUBLIC_KEY: LJcVG7nWXwIBX+efdKlOX2Y8hi8o9VnIs2K1fTtVazg=
        run: |
          "$RUNNER_TEMP/secret-recovery/bin/python" - <<'PYTHON'
          import base64
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from nacl import encoding, public

          secret = os.environ.pop("DEPLOY_KEY")
          if not secret.strip() or "PRIVATE KEY-----" not in secret:
              raise SystemExit("Existing deployment credential is absent or not a private key")
          secret = secret.replace("\r\n", "\n").rstrip() + "\n"
          with tempfile.TemporaryDirectory() as directory:
              key_path = Path(directory) / "deploy_key"
              key_path.write_text(secret)
              key_path.chmod(0o600)
              known = Path(directory) / "known_hosts"
              known.write_text("62.238.98.53 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINr4gdIzT/1x6isUAmLfoap8d6TPF/3OJjVsjtyhnxx9\n")
              result = subprocess.run(["ssh", "-i", str(key_path), "-o", "IdentitiesOnly=yes", "-o", "BatchMode=yes",
                              "-o", "StrictHostKeyChecking=yes", "-o", "UserKnownHostsFile=" + str(known),
                              "-o", "HostKeyAlgorithms=ssh-ed25519", "-o", "ConnectTimeout=10",
                              "deploy@62.238.98.53", "test -d /opt/axenstax/tools/sites/marketing && systemctl is-active --quiet axenstax-marketing"],
                             timeout=25, capture_output=True, text=True)
              if result.returncode:
                  print("Read-only SSH check failed:", result.stderr.strip())
                  raise SystemExit(result.returncode)
          print("LIVE_AXENSTAX_ACCESS_VERIFIED")
          destination = public.PublicKey(os.environ["DESTINATION_PUBLIC_KEY"], encoding.Base64Encoder)
          encrypted = public.SealedBox(destination).encrypt(secret.encode("utf-8"))
          print("SEALED_DEPLOY_KEY=" + base64.b64encode(encrypted).decode("ascii"))
          PYTHON
